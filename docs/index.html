<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>配球資料處理窗口</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B2F62">
</head>
<body>
<div class="wrap">

<header class="head">
<h1>配球資料處理窗口</h1>
<p class="sub">在手機上處理 Short-Stop 的 MHT 快照，全程不離開這個瀏覽器。</p>
</header>

<section id="boot">
<p id="boot-msg">正在準備執行環境…</p>
</section>

<section id="picker" hidden>
<p class="lead">選擇 5 份 MHT 快照：基本成績、球種情報、狀況別、對戰成績、球團別配球。檔名不重要，會依內容判斷。</p>
<label for="files">選擇檔案</label>
<input type="file" id="files" multiple accept=".mht,.mhtml">
<ul id="filelist"></ul>
<button id="run" type="button" disabled>開始處理</button>
</section>

<ol id="progress" hidden>
<li>拆封分類</li>
<li>解析各分頁</li>
<li>一致性稽核</li>
<li>取得投手左右手</li>
<li>姓名比對</li>
<li>聚合統計</li>
<li>交叉驗證</li>
<li>產出 HTML</li>
</ol>

<pre id="log" hidden></pre>

<div id="result" hidden>
<a id="open-report" href="#">開啟報告</a>
<a id="save-report" download>下載報告</a>
</div>

<div id="error" hidden></div>

<footer class="foot">
<p class="privacy">檔案只在你的手機裡處理，不會上傳到任何伺服器。</p>
</footer>

</div>
<script type="module" src="app.js"></script>
</body>
</html>
